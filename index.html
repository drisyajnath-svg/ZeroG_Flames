<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroG Flames - Dev Build</title>

    <!-- Standard Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Utilitarian IDE-like color palette
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ide: {
                            bg: '#1c1e22',
                            surface: '#282c34',
                            border: '#3e4451',
                            text: '#abb2bf',
                            blue: '#61afef',
                            orange: '#d19a66',
                            red: '#e06c75',
                            green: '#98c379'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Quick utilitarian scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1c1e22;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e4451;
            border-radius: 4px;
        }

        /* Reset radio buttons to look standard but usable */
        input[type="radio"] {
            width: 1rem;
            height: 1rem;
            accent-color: #61afef;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-ide-bg text-ide-text flex h-screen overflow-hidden font-sans">

    <!-- Sidebar (Basic structure, no crazy shadows) -->
    <aside class="w-64 bg-ide-surface z-20 flex flex-col shrink-0 border-r border-ide-border">

        <!-- Logo Area with imperfection (skewed beta tag) -->
        <div class="h-16 flex items-center px-4 border-b border-ide-border relative">
            <i data-lucide="flame" class="w-5 h-5 text-ide-orange mr-2"></i>
            <h1 class="text-base font-bold text-gray-200">ZeroG Flames</h1>
            <!-- Imperfect beta badge -->
            <span
                class="absolute top-3 right-4 bg-ide-red text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm transform -rotate-3 border border-red-800">
                BETA v0.9
            </span>
        </div>

        <!-- Navigation / Filters -->
        <div class="p-4 flex-1 flex flex-col">
            <h2 class="text-xs font-semibold text-gray-500 mb-3 uppercase tracking-wider">Target Environment</h2>

            <div class="space-y-2">
                <!-- Standard radio buttons, no fancy CSS tricks -->
                <label
                    class="flex items-center space-x-3 p-2 hover:bg-[#2c313a] rounded cursor-pointer border border-transparent">
                    <input type="radio" name="env" value="lunar" checked onchange="updateDashboard()">
                    <span class="text-sm">Lunar Base (1/6g)</span>
                </label>

                <label
                    class="flex items-center space-x-3 p-2 hover:bg-[#2c313a] rounded cursor-pointer border border-transparent">
                    <input type="radio" name="env" value="martian" onchange="updateDashboard()">
                    <span class="text-sm">Martian Base (3/8g)</span>
                </label>

                <label
                    class="flex items-center space-x-3 p-2 hover:bg-[#2c313a] rounded cursor-pointer border border-transparent">
                    <input type="radio" name="env" value="micro" onchange="updateDashboard()">
                    <span class="text-sm">Space Station (0g)</span>
                </label>
            </div>
        </div>

        <div class="p-4 border-t border-ide-border">
            <!-- Fake dev note -->
            <p class="text-[11px] text-gray-500 font-mono">Status: Connected to local DB</p>
        </div>
    </aside>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col h-full">

        <!-- Header -->
        <header class="h-16 bg-ide-surface border-b border-ide-border flex items-center px-6 justify-between shrink-0">
            <div class="relative w-full max-w-xl flex items-center">
                <i data-lucide="terminal" class="absolute left-3 w-4 h-4 text-gray-500"></i>
                <input type="text" id="searchQuery" placeholder="Enter query (e.g. 'flammability risk PMMA')..."
                    class="w-full bg-[#1e2227] border border-ide-border rounded py-2 pl-9 pr-24 text-sm text-gray-200 focus:outline-none focus:border-ide-blue transition-none"
                    onkeydown="if(event.key === 'Enter') simulateBackendCall()">
                <button onclick="simulateBackendCall()"
                    class="absolute right-1 top-1 bottom-1 bg-[#3e4451] hover:bg-[#4b5363] text-gray-200 px-4 rounded text-xs font-medium border border-[#5c6370] transition-none">
                    Run Analysis
                </button>
            </div>
        </header>

        <!-- Dashboard Content Grid -->
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full min-h-[500px]">

                <!-- Box 1: Output & Debug (Looks slightly messy on purpose) -->
                <div class="bg-ide-surface rounded-md shadow border border-ide-border flex flex-col overflow-hidden">
                    <div class="px-4 py-3 border-b border-ide-border bg-[#21252b] flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                            <i data-lucide="cpu" class="w-4 h-4 text-ide-blue"></i>
                            SI Engine Output
                        </h3>
                    </div>

                    <div class="p-4 flex-1 overflow-y-auto flex flex-col gap-4">
                        <!-- Formatted Text Area -->
                        <div id="aiOutput" class="text-sm leading-relaxed text-ide-text">
                            <!-- Content injected via JS -->
                        </div>

                        <!-- Raw JSON dump (Imperfection/Developer feel) -->
                        <div class="mt-auto pt-4 border-t border-ide-border border-dashed">
                            <p class="text-xs text-gray-500 mb-2 font-mono flex items-center gap-1">
                                <i data-lucide="braces" class="w-3 h-3"></i> raw_context.json
                            </p>
                            <pre id="debugOutput"
                                class="bg-[#1e2227] p-3 rounded text-[11px] font-mono text-ide-green overflow-x-auto border border-[#2c313a]">
// waiting for input...</pre>
                        </div>
                    </div>
                </div>

                <!-- Box 2: Flammability Chart -->
                <div class="bg-ide-surface rounded-md shadow border border-ide-border flex flex-col overflow-hidden">
                    <div class="px-4 py-3 border-b border-ide-border bg-[#21252b] flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                            <i data-lucide="bar-chart-2" class="w-4 h-4 text-ide-orange"></i>
                            Flame Spread Risk (Normalized)
                        </h3>
                        <!-- Human imperfection note -->
                        <span
                            class="text-[10px] bg-yellow-900/30 text-yellow-500 px-1 border border-yellow-700/50">TODO:
                            fix responsive scale</span>
                    </div>
                    <div class="flex-1 p-4 relative w-full h-[300px]">
                        <canvas id="flameChart"></canvas>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Data for different environments (Utilitarian content)
        const dashboardData = {
            lunar: {
                chartData: [85, 92, 60],
                html: `
                    <p class="mb-3"><strong class="text-gray-200">Env:</strong> Lunar Base (1/6g) | <strong class="text-gray-200">O2:</strong> 30% @ 10.2psi</p>
                    <p class="mb-2">Elevated risk profile detected. Higher oxygen concentration makes materials significantly more flammable compared to Earth normal.</p>
                    <ul class="list-disc pl-5 space-y-1 text-gray-400">
                        <li>Buoyancy plays a minor role.</li>
                        <li>Flames are taller and wider.</li>
                    </ul>
                `,
                rawJson: `{\n  "status": 200,\n  "gravity": 0.166,\n  "o2_pct": 30,\n  "risk_flags": ["elevated_o2", "low_buoyancy"]\n}`
            },
            martian: {
                chartData: [75, 88, 55],
                html: `
                    <p class="mb-3"><strong class="text-gray-200">Env:</strong> Martian Base (3/8g) | <strong class="text-gray-200">O2:</strong> Variable</p>
                    <p class="mb-2">Moderate risk profile approaching terrestrial dynamics. Convective flows are stronger here than on the Moon.</p>
                    <ul class="list-disc pl-5 space-y-1 text-gray-400">
                        <li>Standard DAFT smoke sensors are highly effective here.</li>
                        <li>Flame spread rates approach terrestrial models.</li>
                    </ul>
                `,
                rawJson: `{\n  "status": 200,\n  "gravity": 0.375,\n  "o2_pct": 21,\n  "risk_flags": ["terrestrial_mimic"]\n}`
            },
            micro: {
                chartData: [60, 80, 45],
                html: `
                    <p class="mb-3"><strong class="text-gray-200">Env:</strong> ISS (Micro-g) | <strong class="text-gray-200">O2:</strong> 21% - 100%</p>
                    <p class="mb-2">Flames burn spherical and soot-free. Flammability limits are fundamentally altered without buoyancy-driven convection.</p>
                    <ul class="list-disc pl-5 space-y-1 text-gray-400">
                        <li>Spacesuit prep (100% O2) is the primary hazard.</li>
                        <li>Highly dependent on forced ventilation velocities.</li>
                    </ul>
                `,
                rawJson: `{\n  "status": 200,\n  "gravity": 0.0,\n  "o2_pct": [21, 100],\n  "risk_flags": ["spherical_flame", "ventilation_dependent"]\n}`
            }
        };

        // Initialize Chart.js with muted colors
        Chart.defaults.color = '#7f848e';
        Chart.defaults.font.family = 'ui-sans-serif, system-ui, sans-serif';

        const ctx = document.getElementById('flameChart').getContext('2d');

        let riskChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Solid (PMMA)', 'Gas (Propane)', 'Liquid'],
                datasets: [{
                    label: 'Risk Score',
                    data: dashboardData.lunar.chartData,
                    // Muted utilitarian colors
                    backgroundColor: ['#e06c75', '#61afef', '#98c379'],
                    borderWidth: 1,
                    borderColor: '#282c34',
                    barPercentage: 0.7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: '#3e4451' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                animation: { duration: 0 } // Disabled animation for that raw/instant feel
            }
        });

        // Function triggered by Radio Buttons
        function updateDashboard() {
            const envKey = document.querySelector('input[name="env"]:checked').value;
            const data = dashboardData[envKey];

            document.getElementById('aiOutput').innerHTML = data.html;
            document.getElementById('debugOutput').textContent = data.rawJson;

            riskChart.data.datasets[0].data = data.chartData;
            riskChart.update();
        }

        // Initialize default view
        updateDashboard();

        // Simulate AI Backend Call triggered by Search Button
        function simulateBackendCall() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;

            const outputArea = document.getElementById('aiOutput');
            const debugArea = document.getElementById('debugOutput');

            // Raw text loading state
            outputArea.innerHTML = `<p class="text-ide-orange font-mono text-xs">> Fetching embeddings for query...</p>`;
            debugArea.textContent = `{\n  "request": "${query}",\n  "status": "pending_vector_search"\n}`;

            // Mock delay
            setTimeout(() => {
                outputArea.innerHTML = `
                    <p class="mb-2 text-ide-green font-mono text-xs">> Query successful.</p>
                    <p class="mb-3 text-sm">Based on <strong>ACME</strong> datasets, forced-flow velocity non-linearly affects solid fuels in 30% O2.</p>
                    <ul class="list-disc pl-5 space-y-1 text-gray-400 text-sm">
                        <li><span class="text-gray-200">Low Velocity:</span> Accelerates flame spread (feeds O2).</li>
                        <li><span class="text-gray-200">High Velocity:</span> Induces thermal blow-off (quenches).</li>
                    </ul>
                `;

                debugArea.textContent = `{\n  "query": "${query}",\n  "matches": ["ACME_doc_34", "BASS_doc_12"],\n  "confidence_score": 0.92,\n  "execution_time_ms": 1403\n}`;
            }, 1200);
        }
    </script>
</body>

</html>
